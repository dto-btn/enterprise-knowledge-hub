---
name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies with uv
        run: uv sync --locked

      - name: Run Pylint
        run: uv run --no-sync pylint --rcfile=.vscode/pylintrc $(git ls-files '*.py')