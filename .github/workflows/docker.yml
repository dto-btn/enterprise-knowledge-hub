name: Docker (Build/Push)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: enterprise-knowledge-hub
  REGISTRY: ghcr.io
  JOBS_AND_THREADS: 8 # match the self-hosted runner's 8 CPU cores; oversubscribing slows the flash-attn compile down

jobs:
  build:
    name: Build ${{ matrix.label }} image
    runs-on: [self-hosted, ssc-dto]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: CPU
            base_image: cpu
            cuda_arch: ""
            build_flash: "FALSE"
            platforms: linux/amd64,linux/arm64
            tag_suffix: ""
          - label: CUDA H100/H200
            base_image: cuda
            cuda_arch: "9.0"
            build_flash: "TRUE"
            platforms: linux/amd64
            tag_suffix: "-cuda-9.0"
          - label: CUDA L40
            base_image: cuda
            cuda_arch: "8.9"
            build_flash: "FALSE"
            platforms: linux/amd64
            tag_suffix: "-cuda-8.9"
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${TAG_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag version (${TAG_VERSION}) does not match pyproject.toml version (${{ steps.version.outputs.version }})."
            exit 1
          fi

      - name: Install GoC CA cert
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker/certs.d/ghcr.io
          awk '1' certs/GOC-GDC-ROOT-A.crt certs/GOC-GDC-ISSUING-A1A.crt | sudo tee /etc/docker/certs.d/ghcr.io/ca.crt > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."ghcr.io"]
              ca=["/etc/docker/certs.d/ghcr.io/ca.crt"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            CUDA_ARCH=${{ matrix.cuda_arch }}
            JOBS_AND_THREADS=${{ env.JOBS_AND_THREADS }}
            BUILD_FLASH=${{ matrix.build_flash }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.version }}${{ matrix.tag_suffix }}
            ${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ github.sha }}${{ matrix.tag_suffix }}
          # Reuses the compiled flash-attn layer (and other unchanged layers) across
          # runs via the GitHub Actions cache, scoped per matrix entry so the CPU,
          # H100 and L40 builds (different build-args) don't clobber each other's cache.
          cache-from: type=gha,scope=${{ matrix.label }}
          cache-to: type=gha,mode=max,scope=${{ matrix.label }}
