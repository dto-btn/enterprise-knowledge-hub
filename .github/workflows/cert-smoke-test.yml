name: cert-smoke-test (temporary - remove after diagnosis)

on:
  push:

jobs:
  cert-check:
    runs-on: [self-hosted, ssc-dto]
    steps:
      - name: Check cert presented by astral.sh
        run: |
          openssl s_client -connect astral.sh:443 -showcerts </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -sha256 -fingerprint
